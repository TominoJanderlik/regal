<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { margin: 0; width: 320px; color: #16203A; background: #fff; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #16203A; color: #fff; }
  header b { font-size: 16px; }
  header svg { width: 22px; height: 22px; }
  section { padding: 12px 14px; border-bottom: 1px solid #E1E6EC; display: grid; gap: 8px; }
  h2 { font-size: 13px; margin: 0; color: #4B5670; font-weight: 600; }
  p { margin: 0; font-size: 13px; line-height: 1.4; }
  input { width: 100%; height: 36px; border: 1.5px solid #C3CBD6; border-radius: 8px; padding: 0 10px; font-size: 14px; }
  input:focus { outline: none; border-color: #1F4FD8; }
  button { height: 36px; border-radius: 8px; border: 1.5px solid #C3CBD6; background: #fff; font-weight: 600; font-size: 14px; cursor: pointer; color: #16203A; }
  button.primary { background: #1F4FD8; border-color: #1F4FD8; color: #fff; }
  button.yellow { background: #FFC21A; border-color: #FFC21A; }
  .err { color: #C62F2F; } .ok { color: #17845F; }
  .site { font-weight: 600; word-break: break-all; }
  ul { margin: 0; padding-left: 18px; font-size: 12px; color: #4B5670; }
  a { color: #1F4FD8; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <svg viewBox="0 0 32 32"><rect x="3" y="4" width="26" height="24" rx="3" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M3 13h26M3 21h26M16 4v24" stroke="#fff" stroke-width="2.6"/><rect x="18.5" y="14.8" width="8" height="4.6" rx="1" fill="#FFC21A"/></svg>
    <b>Regál</b>
  </header>

  <section id="login" hidden>
    <h2>Prihlásenie (rovnaký účet ako v aplikácii Regál)</h2>
    <form id="login-form">
      <input name="email" type="email" placeholder="E-mail" autocomplete="username" required>
      <div style="height:6px"></div>
      <input name="password" type="password" placeholder="Heslo" autocomplete="current-password" required>
      <div style="height:8px"></div>
      <button class="primary" style="width:100%">Prihlásiť sa</button>
    </form>
    <p id="login-msg" class="err"></p>
  </section>

  <section id="account" hidden>
    <p>Prihlásený: <b id="email"></b></p>
    <button id="logout">Odhlásiť sa</button>
  </section>

  <section id="site-box">
    <h2>Táto stránka</h2>
    <p class="site" id="site"></p>
    <button class="yellow" id="enable" hidden>Zapnúť Regál na tejto stránke</button>
    <button id="disable" hidden>Vypnúť na tejto stránke</button>
    <p id="site-msg"></p>
    <p>Zapni Regál na stránke Balíkova. Po zadaní PIN sa vpravo dole ukáže, kde je zásielka uložená.</p>
  </section>

  <section>
    <h2>Zapnuté stránky</h2>
    <ul id="sites"><li>žiadne</li></ul>
    <a href="https://tominojanderlik.github.io/regal/" target="_blank" rel="noopener">Otvoriť aplikáciu Regál</a>
  </section>
  <script src="popup.js"></script>
</body>
</html>
